<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HRMS Admin — Leave Requests</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg></div>
      <div class="brand-text"><h1>HRMS</h1><span>Admin Panel</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/admin/dashboard.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>Dashboard</a>
      <div class="nav-section-label">HR Management</div>
      <a href="/admin/employees.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Employees</a>
      <a href="/admin/accounts.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>Accounts</a>
      <a href="/admin/departments.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"/></svg>Departments</a>
      <div class="nav-section-label">Operations</div>
      <a href="/admin/leaves.html" class="nav-link active"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>Leave Requests</a>
      <a href="/admin/payroll.html" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Payroll</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><div class="user-avatar" id="userAvatar">A</div><div class="user-info"><div class="name" id="userName">Admin</div><div class="role">Administrator</div></div></div>
      <button class="btn-logout" id="logoutBtn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Sign Out</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <div class="header-breadcrumb"><span>Admin</span><span class="sep">/</span><span class="current">Leave Requests</span></div>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" onclick="loadLeaves()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Refresh
        </button>
      </div>
    </header>

    <div class="page-content">
      <!-- Summary chips -->
      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap" id="leaveSummary"></div>

      <div class="section-card animate-fade">
        <div class="section-header">
          <div><div class="section-title">All Leave Requests</div><div class="section-subtitle" id="leaveCount">Loading…</div></div>
        </div>
        <div style="padding:16px 24px;border-bottom:1px solid var(--border)">
          <div class="toolbar" style="margin-bottom:0">
            <div class="search-box">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input type="text" id="leaveSearch" placeholder="Search by employee name…" />
            </div>
            <div class="toolbar-actions">
              <select class="filter-select" id="leaveStatusFilter">
                <option value="">All Status</option>
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Rejected">Rejected</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead>
              <tr><th>Employee</th><th>Leave Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="leaveTableBody">
              <tr><td colspan="8" style="text-align:center;padding:48px;color:var(--text-muted)">Loading leave requests…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="leavePagination">
          <span class="pagination-info" id="leavePageInfo"></span>
          <div class="pagination-controls" id="leavePageControls"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
  const API=`http://localhost:3000`,token=localStorage.getItem('hrms_admin_token'),user=JSON.parse(localStorage.getItem('hrms_admin_user')||'null');
  (function checkProtocol() {
    if (window.location.protocol === 'file:') {
      document.body.innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0f17;font-family:system-ui,sans-serif;padding:20px">
          <div style="background:#1a1a2e;border:1px solid rgba(239,68,68,0.4);border-radius:12px;padding:32px;max-width:500px;text-align:center">
            <div style="font-size:48px;margin-bottom:16px">⚠️</div>
            <h2 style="color:#f87171;margin:0 0 12px">Wrong URL</h2>
            <p style="color:#94a3b8;margin:0 0 20px;line-height:1.6">You opened this file directly from your filesystem.<br>The admin panel must be served through the Node.js server.</p>
            <a href="http://localhost:3000/admin/index.html" style="display:inline-block;background:#6366f1;color:white;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600">Open Admin Panel →</a>
            <p style="color:#64748b;font-size:13px;margin:16px 0 0">Make sure <code style="color:#818cf8">nodemon server.js</code> is running first</p>
          </div>
        </div>`;
      throw new Error("Cannot run on file:// protocol");
    }
  })();
  if(!token||!user||user.role!=='admin') window.location.replace('/admin/index.html');
  if(user){document.getElementById('userName').textContent=user.name||'Admin';document.getElementById('userAvatar').textContent=(user.name||'A')[0].toUpperCase();}
  document.getElementById('logoutBtn').addEventListener('click',()=>{localStorage.removeItem('hrms_admin_token');localStorage.removeItem('hrms_admin_user');window.location.replace('/admin/index.html');});
  function authH(){return{'Content-Type':'application/json','Authorization':`Bearer ${token}`};}

  function toast(type,title,msg){
    const icons={success:'<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>',error:'<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>',info:'<path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>'};
    const el=document.createElement('div');el.className=`toast ${type}`;
    el.innerHTML=`<div class="toast-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">${icons[type]||icons.info}</svg></div><div class="toast-body"><div class="toast-title">${title}</div>${msg?`<div class="toast-msg">${msg}</div>`:''}</div>`;
    document.getElementById('toastContainer').appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
    setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),350);},3500);
  }

  let allLeaves=[],filtered=[],page=1;const PER=12;

  function fmtDate(d){return d?new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';}

  function statusBadge(s){
    const m={Pending:'warning',Approved:'success',Rejected:'danger',Cancelled:'muted'};
    return `<span class="badge ${m[s]||'muted'}"><span class="badge-dot"></span>${s||'—'}</span>`;
  }

  function getName(leave){
    const emp=leave.employee;
    if(!emp) return leave.employeeId||'Unknown';
    return `${emp.firstName||''} ${emp.lastName||''}`.trim()||emp.email||'—';
  }

  function renderLeaves(){
    const tbody=document.getElementById('leaveTableBody');
    const start=(page-1)*PER;
    const rows=filtered.slice(start,start+PER);
    if(!rows.length){tbody.innerHTML=`<tr><td colspan="8"><div class="empty-state"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div><h3>No leave requests found</h3></div></td></tr>`;return;}
    tbody.innerHTML=rows.map(l=>{
      const name=getName(l);
      const type=l.leaveType?.name||l.leaveTypeName||'—';
      const days=l.totalDays||l.days||'—';
      const reason=(l.reason||'—').slice(0,40)+(l.reason?.length>40?'…':'');
      const canAct=l.status==='Pending';
      return `<tr>
        <td><div class="cell-user"><div class="cell-avatar">${name[0]?.toUpperCase()||'?'}</div><div><div class="cell-name">${name}</div></div></div></td>
        <td><span class="badge accent">${type}</span></td>
        <td>${fmtDate(l.startDate||l.fromDate)}</td>
        <td>${fmtDate(l.endDate||l.toDate)}</td>
        <td style="font-weight:600">${days}</td>
        <td style="color:var(--text-muted);font-size:13px" title="${l.reason||''}">${reason}</td>
        <td>${statusBadge(l.status)}</td>
        <td><div class="flex gap-2">
          ${canAct?`
            <button class="btn btn-success btn-sm" onclick="actionLeave('${l._id}','approve')">✓ Approve</button>
            <button class="btn btn-danger btn-sm" onclick="actionLeave('${l._id}','reject')">✗ Reject</button>
          `:`<span class="text-muted text-sm">—</span>`}
        </div></td>
      </tr>`;
    }).join('');

    const total=filtered.length,pages=Math.ceil(total/PER);
    document.getElementById('leavePageInfo').textContent=`Showing ${start+1}–${Math.min(start+PER,total)} of ${total}`;
    let ph=`<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>&lsaquo;</button>`;
    for(let i=1;i<=pages;i++){
      if(i===1||i===pages||Math.abs(i-page)<=1) ph+=`<button class="page-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
      else if(Math.abs(i-page)===2) ph+=`<span class="page-btn" style="cursor:default">…</span>`;
    }
    ph+=`<button class="page-btn" onclick="goPage(${page+1})" ${page===pages||pages===0?'disabled':''}>&rsaquo;</button>`;
    document.getElementById('leavePageControls').innerHTML=ph;
  }

  function goPage(p){const pages=Math.ceil(filtered.length/PER);if(p<1||p>pages)return;page=p;renderLeaves();}

  function applyFilter(){
    const q=document.getElementById('leaveSearch').value.toLowerCase();
    const s=document.getElementById('leaveStatusFilter').value;
    filtered=allLeaves.filter(l=>{
      const name=getName(l).toLowerCase();
      return(!q||name.includes(q))&&(!s||l.status===s);
    });
    page=1;renderLeaves();
  }

  document.getElementById('leaveSearch').addEventListener('input',applyFilter);
  document.getElementById('leaveStatusFilter').addEventListener('change',applyFilter);

  async function loadLeaves(){
    document.getElementById('leaveTableBody').innerHTML=`<tr><td colspan="8" style="text-align:center;padding:48px;color:var(--text-muted)">Loading…</td></tr>`;
    try{
      const res=await fetch(`${API}/api/v1/leaves/all`,{headers:authH()});
      const data=await res.json();
      if(!res.ok) throw new Error(data.message||'Failed');
      allLeaves=data.leaves||data.data||[];
      document.getElementById('leaveCount').textContent=`${allLeaves.length} total requests`;
      // Summary chips
      const counts={Pending:0,Approved:0,Rejected:0,Cancelled:0};
      allLeaves.forEach(l=>{if(counts[l.status]!==undefined)counts[l.status]++;});
      const cmap={Pending:'warning',Approved:'success',Rejected:'danger',Cancelled:'muted'};
      document.getElementById('leaveSummary').innerHTML=Object.entries(counts).map(([k,v])=>`<span class="badge ${cmap[k]}" style="padding:6px 14px;font-size:13px"><span class="badge-dot"></span>${k}: ${v}</span>`).join('');
      applyFilter();
    }catch(err){toast('error','Error',err.message);}
  }

  async function actionLeave(id,action){
    try{
      const res=await fetch(`${API}/api/v1/leaves/${id}/${action}`,{method:'PATCH',headers:authH()});
      const data=await res.json();
      if(!res.ok) throw new Error(data.message||`${action} failed`);
      toast('success',`Leave ${action==='approve'?'Approved':'Rejected'}`,`Decision recorded.`);
      loadLeaves();
    }catch(err){toast('error','Error',err.message);}
  }

  loadLeaves();
</script>
</body>
</html>
