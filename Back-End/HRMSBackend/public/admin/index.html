<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HRMS Admin — Sign In</title>
  <meta name="description" content="HRMS Admin Portal — Secure administrator login" />
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .form-group { margin-bottom: 20px; }
    .login-divider { text-align: center; color: var(--text-muted); font-size: 12px; margin: 18px 0; }
    .default-creds {
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: var(--r-md);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .default-creds strong { color: var(--accent-light); }
  </style>
</head>
<body>
  <div class="login-page">
    <!-- Animated Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
          </svg>
        </div>
        <h1>HRMS Admin</h1>
        <p>Human Resource Management System</p>
      </div>

      <!-- Alert -->
      <div id="loginAlert" class="login-alert hidden"></div>

      <!-- Default credentials hint -->
      <div class="default-creds">
        <strong>Default credentials:</strong> admin@hrms.com &nbsp;/&nbsp; Admin@1234
      </div>

      <!-- Form -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label required" for="email">Email Address</label>
          <input
            id="email"
            type="email"
            class="form-control"
            placeholder="admin@hrms.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label required" for="password">Password</label>
          <div class="password-wrapper">
            <input
              id="password"
              type="password"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="btn-toggle-pw" id="togglePw" aria-label="Toggle password visibility">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary login-submit" id="loginBtn">
          <span id="btnText">Sign In to Admin Panel</span>
        </button>
      </form>

      <div class="login-footer">
        &copy; 2024 HRMS · Secure Admin Access Only
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API = 'http://localhost:3000';

    // ── Check if opened as file:// ─────────────────────
    (function checkProtocol() {
      if (window.location.protocol === 'file:') {
        document.body.innerHTML = `
          <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0f17;font-family:system-ui,sans-serif;padding:20px">
            <div style="background:#1a1a2e;border:1px solid rgba(239,68,68,0.4);border-radius:12px;padding:32px;max-width:500px;text-align:center">
              <div style="font-size:48px;margin-bottom:16px">⚠️</div>
              <h2 style="color:#f87171;margin:0 0 12px">Wrong URL</h2>
              <p style="color:#94a3b8;margin:0 0 20px;line-height:1.6">You opened this file directly from your filesystem.<br>The admin panel must be served through the Node.js server.</p>
              <a href="http://localhost:3000/admin/index.html" style="display:inline-block;background:#6366f1;color:white;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600">Open Admin Panel →</a>
              <p style="color:#64748b;font-size:13px;margin:16px 0 0">Make sure <code style="color:#818cf8">nodemon server.js</code> is running first</p>
            </div>
          </div>`;
        return;
      }
    })();

    (function checkAuth() {
      const token = localStorage.getItem('hrms_admin_token');
      const user  = JSON.parse(localStorage.getItem('hrms_admin_user') || 'null');
      if (token && user && user.role === 'admin') {
        window.location.replace('/admin/dashboard.html');
      }
    })();

    // ── Toggle password visibility ─────────────────────
    document.getElementById('togglePw').addEventListener('click', function() {
      const pw = document.getElementById('password');
      const icon = document.getElementById('eyeIcon');
      if (pw.type === 'password') {
        pw.type = 'text';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
        `;
      } else {
        pw.type = 'password';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        `;
      }
    });

    // ── Show alert ─────────────────────────────────────
    function showAlert(type, message) {
      const el = document.getElementById('loginAlert');
      el.className = `login-alert ${type}`;
      el.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" style="width:16px;height:16px;flex-shrink:0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>${message}</span>
      `;
    }

    function hideAlert() {
      document.getElementById('loginAlert').className = 'login-alert hidden';
    }

    // ── Login form submit ──────────────────────────────
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAlert();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const btnText  = document.getElementById('btnText');

      if (!email || !password) {
        showAlert('error', 'Please enter your email and password.');
        return;
      }

      // Loading state
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Signing in…';

      try {
        const res  = await fetch(`${API}/api/v1/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Login failed. Please check your credentials.');
        }

        // Role check
        if (data.user.role !== 'admin') {
          throw new Error('Access denied. This portal is for administrators only.');
        }

        // Store credentials
        localStorage.setItem('hrms_admin_token', data.token);
        localStorage.setItem('hrms_admin_user',  JSON.stringify(data.user));

        showAlert('success', 'Login successful! Redirecting to dashboard…');

        setTimeout(() => {
          window.location.replace('/admin/dashboard.html');
        }, 800);

      } catch (err) {
        showAlert('error', err.message);
        btn.disabled = false;
        btnText.textContent = 'Sign In to Admin Panel';
      }
    });

    // Enter key submits form
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
